name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: tests · types · lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group knowledge-pdf --group knowledge-office --group knowledge-s3
      - name: Tests
        run: uv run python -m pytest -q --cov=reactifact --cov-report=xml --cov-fail-under=85
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Types (mypy)
        run: uv run python -m mypy
      - name: Lint (ruff)
        run: uv run python -m ruff check
      - name: Format (ruff)
        run: uv run python -m ruff format --check
      - name: Architecture (import-linter)
        run: uv run lint-imports

  docs:
    name: docs (mkdocs --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: "3.12"
      - name: Build (strict)
        run: uv run --group docs mkdocs build --strict -d /tmp/mkdocs_out

  a2a-interop:
    name: a2a interop (official a2a-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: "3.12"
      - name: Interop with a2a-sdk
        run: uv run --group a2a python -m pytest tests/test_a2a_interop.py -q

  build-and-smoke:
    name: build wheel + smoke
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Build
        run: uv build
      - name: Wheel smoke (clean venv)
        run: |
          uv venv /tmp/reactifact-ci
          uv pip install --python /tmp/reactifact-ci/bin/python dist/reactifact-*.whl
          /tmp/reactifact-ci/bin/python -c "import reactifact; print('version', reactifact.__version__)"
          /tmp/reactifact-ci/bin/python -c "from reactifact.knowledge import HttpConnector, S3Connector, MMR, PdfExtractor; from reactifact.eval import evaluate_retrieval; print('knowledge ok')"
          /tmp/reactifact-ci/bin/reactifact --help >/dev/null
          if unzip -Z1 dist/reactifact-*.whl | grep -qE "^(examples|tests)/"; then echo "examples/tests leaked into wheel"; exit 1; fi
          if ! unzip -Z1 dist/reactifact-*.whl | grep -q "^reactifact/templates/fastapi_chat/app/main.py$"; then echo "fastapi template missing from wheel"; exit 1; fi
          if ! unzip -Z1 dist/reactifact-*.whl | grep -q "^reactifact/templates/daemon/app/main.py$"; then echo "daemon template missing from wheel"; exit 1; fi
          for path in \
            reactifact/knowledge/connectors/http.py \
            reactifact/knowledge/connectors/s3.py \
            reactifact/knowledge/extract/pdf.py \
            reactifact/knowledge/extract/docx.py \
            reactifact/eval/retrieval.py \
            reactifact/skills/reactifact-rag/SKILL.md; do
            if ! unzip -Z1 dist/reactifact-*.whl | grep -q "^$path$"; then
              echo "missing from wheel: $path"; exit 1
            fi
          done
      - name: Generated template smoke
        run: |
          uv pip install --python /tmp/reactifact-ci/bin/python \
            pydantic-settings pytest fastapi uvicorn ruff mypy httpx2
          rm -rf /tmp/reactifact-app /tmp/reactifact-daemon

          /tmp/reactifact-ci/bin/reactifact new app /tmp/reactifact-app
          (cd /tmp/reactifact-app && PYTHONPATH=. /tmp/reactifact-ci/bin/python -m pytest -q)
          (cd /tmp/reactifact-app && /tmp/reactifact-ci/bin/ruff check app tests)
          (cd /tmp/reactifact-app && MYPYPATH=. /tmp/reactifact-ci/bin/mypy)
          (cd /tmp/reactifact-app && APP_AUTH_TOKEN=ci /tmp/reactifact-ci/bin/reactifact doctor --path .)

          /tmp/reactifact-ci/bin/reactifact new daemon /tmp/reactifact-daemon
          (cd /tmp/reactifact-daemon && PYTHONPATH=. /tmp/reactifact-ci/bin/python -m pytest -q)
          (cd /tmp/reactifact-daemon && /tmp/reactifact-ci/bin/ruff check app tests)
          (cd /tmp/reactifact-daemon && MYPYPATH=. /tmp/reactifact-ci/bin/mypy)
