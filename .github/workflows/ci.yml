name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: tests · types · lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Tests
        run: uv run python -m pytest -q --cov=reactifact --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Types (mypy)
        run: uv run python -m mypy
      - name: Lint (ruff)
        run: uv run python -m ruff check
      - name: Format (ruff)
        run: uv run python -m ruff format --check

  build-and-smoke:
    name: build wheel + smoke
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Build
        run: uv build
      - name: Wheel smoke (clean venv)
        run: |
          uv venv /tmp/reactifact-ci
          uv pip install --python /tmp/reactifact-ci/bin/python dist/reactifact-*.whl
          /tmp/reactifact-ci/bin/python -c "import reactifact; print('version', reactifact.__version__)"
          /tmp/reactifact-ci/bin/reactifact --help >/dev/null
          /tmp/reactifact-ci/bin/reactifact graph examples.knowledge.agents >/dev/null 2>&1 || true
          if unzip -l dist/reactifact-*.whl | grep -qE "examples/|tests/"; then echo "examples/tests leaked into wheel"; exit 1; fi