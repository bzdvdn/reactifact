name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-url:
        description: "PyPI repository (empty = default/secret; e.g. https://test.pypi.org/legacy/ to stage)"
        required: false
        default: ""

jobs:
  release:
    name: checks + build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.x"
          python-version: "3.12"

      - name: Install
        run: uv sync

      - name: Tests
        run: uv run python -m pytest -q
      - name: Types (mypy)
        run: uv run python -m mypy
      - name: Lint (ruff)
        run: uv run python -m ruff check

      - name: Build
        run: uv build

      - name: Publish to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          PYPI_URL: ${{ inputs.publish-url || secrets.PYPI_URL || 'https://upload.pypi.org/legacy/' }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::PYPI_TOKEN secret is not set — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          uv publish --publish-url "$PYPI_URL" --token "$PYPI_TOKEN"