<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Cover: Your agent re-sends the email on retry — an outbox for side effects. Record the intent as state, deliver it once after the commit.">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <rect x="0" y="0" width="12" height="420" fill="#e4572e"/>
  <defs>
    <marker id="c-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14171c"/></marker>
    <marker id="c-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker>
  </defs>

  <text x="64" y="70" font-family="IBM Plex Mono, monospace" font-size="19" font-weight="600" fill="#e4572e">reactifact</text>

  <text x="64" y="170" font-family="IBM Plex Sans, sans-serif" font-size="52" font-weight="800" fill="#14171c">Your agent re-sends</text>
  <text x="64" y="230" font-family="IBM Plex Sans, sans-serif" font-size="52" font-weight="800" fill="#14171c">the email on retry</text>
  <text x="64" y="286" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#5b6472">Record the intent as state; deliver it once, after the commit.</text>

  <rect x="64" y="336" width="150" height="48" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
  <text x="139" y="365" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#14171c">produce()</text>
  <path d="M214,360 L264,360" stroke="#14171c" stroke-width="1.8" marker-end="url(#c-ink)"/>
  <rect x="266" y="336" width="150" height="48" rx="8" fill="#ffffff" stroke="#14171c" stroke-width="1.5"/>
  <text x="341" y="365" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#14171c">commit</text>
  <path d="M416,360 L500,360" stroke="#e4572e" stroke-width="2" marker-end="url(#c-accent)"/>
  <text x="458" y="350" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#e4572e">after commit</text>
  <rect x="502" y="336" width="180" height="48" rx="8" fill="#ffffff" stroke="#14171c" stroke-width="1.5"/>
  <text x="592" y="365" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#14171c">dispatcher</text>
  <path d="M682,360 L760,360" stroke="#14171c" stroke-width="1.8" marker-end="url(#c-ink)"/>
  <rect x="762" y="336" width="174" height="48" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
  <text x="849" y="365" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#14171c">email / webhook</text>
</svg>
