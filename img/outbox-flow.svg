<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-label="Diagram: a produce records an outbound side effect as a PendingAction (no I/O), the runtime compiles it into one atomic patch and commits it, and only after the commit does a dispatcher call the external world once per stable id. Replay, retry and merge rebuild the state from the commit chain and never re-send.">
  <rect x="0" y="0" width="1120" height="360" fill="#ffffff"/>
  <defs>
    <marker id="d-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14171c"/></marker>
    <marker id="d-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker>
  </defs>

  <!-- produce -->
  <rect x="20" y="70" width="240" height="100" rx="8" fill="#ffffff" stroke="#14171c" stroke-width="1.5"/>
  <text x="140" y="95" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#14171c">produce()</text>
  <text x="34" y="118" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5b6472">call.effects.act("notify",</text>
  <text x="34" y="133" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5b6472">  key="notify:&lt;order id&gt;")</text>
  <text x="140" y="156" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#e4572e" font-style="italic">records intent — no I/O here</text>

  <path d="M260,120 L320,120" stroke="#14171c" stroke-width="1.8" marker-end="url(#d-ink)"/>
  <text x="290" y="110" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#5b6472">compile</text>
  <text x="290" y="136" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#5b6472">atomic patch</text>

  <!-- commit -->
  <rect x="320" y="80" width="170" height="80" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
  <text x="405" y="108" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="#14171c">Context commit</text>
  <text x="405" y="130" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5b6472">PendingAction (state)</text>

  <path d="M490,120 L570,120" stroke="#e4572e" stroke-width="2" marker-end="url(#d-accent)"/>
  <text x="530" y="110" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#e4572e">after commit</text>

  <!-- dispatcher -->
  <rect x="570" y="80" width="180" height="80" rx="8" fill="#ffffff" stroke="#14171c" stroke-width="1.5"/>
  <text x="660" y="108" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="#14171c">dispatcher</text>
  <text x="660" y="130" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5b6472">once per stable id</text>

  <path d="M750,120 L830,120" stroke="#14171c" stroke-width="1.8" marker-end="url(#d-ink)"/>

  <!-- world -->
  <rect x="830" y="80" width="180" height="80" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
  <text x="920" y="104" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" font-weight="600" fill="#14171c">email / webhook</text>
  <text x="920" y="124" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#5b6472">idempotency_key</text>
  <text x="920" y="140" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#5b6472">dedupes on their side</text>

  <!-- replay / retry / merge -->
  <rect x="320" y="250" width="430" height="58" rx="8" stroke-dasharray="5 4" fill="#f6f7f9" stroke="#5b6472" stroke-width="1.5"/>
  <text x="535" y="274" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11.5" font-weight="600" fill="#14171c">replay · retry · merge</text>
  <text x="535" y="293" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#5b6472">rebuild state from the commit chain — never re-send</text>

  <path d="M480,250 L480,164" fill="none" stroke="#e4572e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#d-accent)"/>

  <text x="20" y="340" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#5b6472">State is versioned and reproducible; the world is not — the produce declares which is which.</text>
</svg>
