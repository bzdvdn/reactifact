<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-label="Diagram: five stage agents react in sequence to Project.stage — collect, design, plan, estimate, approval — each consuming the artifact the previous stage produced. If the estimate is over budget, the flow loops back to the plan stage and rebuilds it, rather than simply shrinking the estimate total, before continuing to approval.">
  <rect x="0" y="0" width="1080" height="440" fill="#ffffff"/>
  <defs>
    <marker id="r-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14171c"/></marker>
    <marker id="r-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker>
  </defs>

  <g font-family="IBM Plex Mono, monospace" fill="#14171c">
    <rect x="16" y="30" width="168" height="90" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
    <text x="100" y="52" text-anchor="middle" font-size="13" font-weight="600">collect</text>
    <text x="100" y="72" text-anchor="middle" font-size="9.5" fill="#5b6472">in: Project(collect)</text>
    <text x="100" y="88" text-anchor="middle" font-size="9.5" fill="#5b6472">out: ProjectInfo</text>
    <text x="100" y="104" text-anchor="middle" font-size="9.5" fill="#5b6472">→ Project(design)</text>

    <rect x="214" y="30" width="168" height="90" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
    <text x="298" y="52" text-anchor="middle" font-size="13" font-weight="600">design</text>
    <text x="298" y="72" text-anchor="middle" font-size="9.5" fill="#5b6472">in: Project(design)</text>
    <text x="298" y="88" text-anchor="middle" font-size="9.5" fill="#5b6472">out: DesignPick</text>
    <text x="298" y="104" text-anchor="middle" font-size="9.5" fill="#5b6472">→ Project(plan)</text>

    <rect x="412" y="30" width="168" height="90" rx="8" fill="#ffffff" stroke="#14171c" stroke-width="1.8"/>
    <text x="496" y="52" text-anchor="middle" font-size="13" font-weight="600">plan</text>
    <text x="496" y="72" text-anchor="middle" font-size="9.5" fill="#5b6472">in: Project(plan)</text>
    <text x="496" y="88" text-anchor="middle" font-size="9.5" fill="#5b6472">out: PlanStep ×N</text>
    <text x="496" y="104" text-anchor="middle" font-size="9.5" fill="#5b6472">→ Project(estimate)</text>

    <rect x="610" y="30" width="168" height="90" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
    <text x="694" y="52" text-anchor="middle" font-size="13" font-weight="600">estimate</text>
    <text x="694" y="72" text-anchor="middle" font-size="9.5" fill="#5b6472">in: PlanStep ×N</text>
    <text x="694" y="88" text-anchor="middle" font-size="9.5" fill="#5b6472">out: Estimate</text>
    <text x="694" y="104" text-anchor="middle" font-size="9.5" fill="#5b6472">→ Project(approval)</text>

    <rect x="808" y="30" width="168" height="90" rx="8" fill="#f6f7f9" stroke="#c7ced9" stroke-width="1.5"/>
    <text x="892" y="52" text-anchor="middle" font-size="13" font-weight="600">approval</text>
    <text x="892" y="72" text-anchor="middle" font-size="9.5" fill="#5b6472">in: Estimate</text>
    <text x="892" y="88" text-anchor="middle" font-size="9.5" fill="#5b6472">out: ChatReply</text>
  </g>

  <path d="M184,75 L208,75" stroke="#14171c" stroke-width="1.8" marker-end="url(#r-ink)"/>
  <path d="M382,75 L406,75" stroke="#14171c" stroke-width="1.8" marker-end="url(#r-ink)"/>
  <path d="M580,75 L604,75" stroke="#14171c" stroke-width="1.8" marker-end="url(#r-ink)"/>
  <path d="M778,75 L802,75" stroke="#14171c" stroke-width="1.8" marker-end="url(#r-ink)"/>

  <path d="M694,120 C694,220 570,220 500,124" fill="none" stroke="#e4572e" stroke-width="2.2" marker-end="url(#r-accent)"/>
  <text x="694" y="168" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#e4572e" font-weight="600">over budget → back to plan</text>
  <text x="694" y="186" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#5b6472">rebuilds PlanStep, not just Estimate.total</text>

  <g opacity="0.55">
    <rect x="620" y="270" width="150" height="52" rx="8" fill="none" stroke="#5b6472" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="630" y1="280" x2="760" y2="312" stroke="#5b6472" stroke-width="1.4"/>
    <line x1="630" y1="312" x2="760" y2="280" stroke="#5b6472" stroke-width="1.4"/>
    <text x="695" y="300" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#5b6472">just shrink Estimate.total</text>
  </g>
  <path d="M694,196 C694,225 694,245 694,264" fill="none" stroke="#5b6472" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="784" y="252" font-family="IBM Plex Sans, sans-serif" font-size="10.5" fill="#5b6472" font-style="italic">not this</text>

  <text x="16" y="380" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#5b6472">State machine on <code style="font-family:'IBM Plex Mono',monospace">Project.stage</code> — no separate graph declares this order; each stage is a <code style="font-family:'IBM Plex Mono',monospace">Produce</code> reacting to the <code style="font-family:'IBM Plex Mono',monospace">Project</code> it finds at that stage.</text>
</svg>
