<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ремонт AI (reactifact)</title>
<style>
  :root { --bg:#10151a; --panel:#182129; --line:#26313c; --fg:#e6edf3; --muted:#8b98a5; --acc:#4cc2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header b { color:var(--acc); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  #messages { display:flex; flex-direction:column; gap:10px; min-height:50vh; }
  .msg { max-width:80%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#1f6feb22; border:1px solid #1f6feb66; }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .preview { max-width:170px; max-height:160px; object-fit:cover; border-radius:8px; cursor:zoom-in; }
  #lightbox { position:fixed; inset:0; background:rgba(8,10,12,.88); display:none;
    align-items:center; justify-content:center; z-index:60; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:92vw; max-height:92vh; border-radius:8px; }
  .status { color:var(--muted); font-style:italic; }
  .waiting { color:#ffd479; }
  .proposal { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .proposal h3 { margin:0 0 8px; font-size:13px; color:var(--acc); text-transform:uppercase; letter-spacing:.5px; }
  .proposal h3:not(:first-child) { margin-top:14px; }
  .plan-steps { margin:0; padding-left:20px; }
  .plan-steps li { margin:4px 0; }
  .plan-steps .materials { color:var(--muted); font-size:12px; }
  .est-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .est-table th, .est-table td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .est-table th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  .est-table .num { text-align:right; font-variant-numeric:tabular-nums; }
  .est-item { max-width:260px; }
  .est-foot { display:flex; gap:18px; margin-top:8px; font-size:13px; }
  .est-foot .total { margin-left:auto; font-weight:650; }
  .est-note { margin-top:8px; color:#ffd479; font-size:12.5px; }
  .est-over { color:#ff7b7b; }
  .csv-btn { margin-top:10px; padding:6px 12px; border-radius:8px; border:1px solid var(--acc); background:transparent; color:var(--acc); cursor:pointer; font-size:12.5px; }
  .csv-btn:hover { background:#4cc2ff22; }
  .controls { margin-top:16px; display:flex; gap:10px; }
  #input { flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); }
  button { padding:10px 18px; border-radius:10px; border:1px solid var(--acc); background:transparent; color:var(--acc); cursor:pointer; }
  button:hover { background:#4cc2ff22; }
</style>
</head>
<body>
<header><b>Ремонт AI</b><span class="muted" id="sid"></span><button id="new-session" style="margin-left:auto">Новая сессия</button></header>
<main>
  <div id="messages"></div>
  <div class="controls">
    <input id="input" placeholder="Напишите о комнате: тип, площадь, бюджет…" autofocus />
    <button id="send">Отправить</button>
  </div>
</main>
<script>
let sid = localStorage["repair-session"] || (localStorage["repair-session"] = crypto.randomUUID().replace(/-/g,"").slice(0,24));
let lastProposalTotal = null;
function renderSid() { document.getElementById("sid").textContent = "сессия: " + sid; }
renderSid();

function add(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  document.getElementById("messages").appendChild(el);
  el.scrollIntoView();
}

function addImages(paths) {
  const box = document.createElement("div");
  box.className = "msg assistant";
  box.style.display = "flex";
  box.style.flexWrap = "wrap";
  box.style.gap = "8px";
  for (const src of paths) {
    const img = document.createElement("img");
    img.src = src;
    img.className = "preview";
    img.addEventListener("click", (e) => { e.stopPropagation(); openLightbox(src); });
    box.appendChild(img);
  }
  document.getElementById("messages").appendChild(box);
}

function fmt(n) {
  return Number(n || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 });
}

function planBlock(plan) {
  if (!plan || !plan.length) return "";
  const items = plan.map((s) =>
    "<li><b>" + escapeHtml(s.name || "") + "</b> — " + escapeHtml(s.description || "") +
    (s.materials && s.materials.length ? '<div class="materials">' + escapeHtml(s.materials.join(" · ")) + "</div>" : "") +
    "</li>"
  ).join("");
  return '<h3>План</h3><ol class="plan-steps">' + items + "</ol>";
}

function estimateBlock(est) {
  if (!est || !est.lines || !est.lines.length) return "";
  const rows = est.lines.map((l) =>
    "<tr><td class=\"est-item\">" + escapeHtml(l.name || "") + "</td>" +
    '<td class="num">' + fmt(l.quantity) + "</td>" +
    "<td>" + escapeHtml(l.unit || "") + "</td>" +
    '<td class="num">' + fmt(l.unit_price) + " ₽</td>" +
    '<td class="num">' + fmt(l.total) + " ₽</td></tr>"
  ).join("");
  const note = (est.warnings || []).length
    ? '<div class="est-note">⚠ ' + escapeHtml(est.warnings.join(" · ")) + "</div>"
    : "";
  const over = est.total != null && est.budget != null && est.total > est.budget
    ? ' <span class="est-over">(превышает бюджет)</span>'
    : "";
  return '<h3>Смета</h3><div style="overflow-x:auto"><table class="est-table">' +
    "<thead><tr><th>Описание</th><th class=\"num\">Кол-во</th><th>Ед</th><th class=\"num\">Цена</th><th class=\"num\">Сумма</th></tr></thead><tbody>" +
    rows + "</tbody></table></div>" +
    '<div class="est-foot"><span>Подзаголовок: ' + fmt(est.subtotal) + " ₽</span>" +
    '<span class="total">Итого: ' + fmt(est.total) + " ₽" + over + "</span></div>" +
    note;
}

function renderProposal(state) {
  if (!state || !(state.plan && state.plan.length) || !state.estimate) return;
  const box = document.createElement("div");
  box.className = "proposal";
  box.innerHTML = planBlock(state.plan) + estimateBlock(state.estimate);
  const btn = document.createElement("button");
  btn.className = "csv-btn";
  btn.textContent = "Смета CSV";
  btn.addEventListener("click", downloadCsv);
  box.appendChild(btn);
  document.getElementById("messages").appendChild(box);
  box.scrollIntoView();
}

async function downloadCsv() {
  const r = await fetch("/api/runs/" + sid + "/estimate.csv");
  if (!r.ok) return;
  const blob = await r.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "smeta.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function openLightbox(src) {
  let lb = document.getElementById("lightbox");
  if (!lb) {
    lb = document.createElement("div");
    lb.id = "lightbox";
    lb.addEventListener("click", () => lb.classList.remove("open"));
    document.body.appendChild(lb);
  }
  lb.innerHTML = '<img src="' + src + '" alt="превью" />';
  lb.classList.add("open");
}

async function send(text) {
  add("user", text);
  const resp = await fetch("/api/chat/stream", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({message: text, session_id: sid}),
  });
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let currentEvent = null;
  let statusEl = null;
  let statusShownAt = 0;
  const minStatusMs = 350;
  async function removeStatus() {
    if (!statusEl) return;
    const held = performance.now() - statusShownAt;
    if (held < minStatusMs) await new Promise((r) => setTimeout(r, minStatusMs - held));
    statusEl.remove();
    statusEl = null;
  }
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    let idx;
    while ((idx = buffer.indexOf("\n\n")) !== -1) {
      const frame = buffer.slice(0, idx); buffer = buffer.slice(idx + 2);
      let event = currentEvent; let data = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data = line.slice(5).trim();
      }
      if (!data) continue;
      const payload = JSON.parse(data);
      if (event === "status") {
        if (!statusEl) { statusEl = addTo("status", ""); }
        statusEl.textContent = "… " + payload.message;
        statusShownAt = performance.now();
      } else if (event === "message") {
        await removeStatus();
        if ((payload.images || []).length) addImages(payload.images);
        add("assistant", payload.reply);
        if (payload.waiting) {
          const w = addTo("status", "");
          w.className = "status waiting";
          w.textContent = payload.reply.length ? "Жду: утвердить (да) или изменить?" : "";
        }
      }
    }
  }
  const st = await (await fetch("/api/runs/" + sid)).json();
  if (st.estimate && st.estimate.total !== lastProposalTotal) {
    renderProposal(st);
    lastProposalTotal = st.estimate.total;
  }
}

function addTo(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  document.getElementById("messages").appendChild(el);
  return el;
}

async function loadHistory() {
  const r = await fetch("/api/runs/" + sid);
  const state = await r.json();
  for (const m of state.messages || []) {
    if ((m.images || []).length) addImages(m.images);
    add(m.role === "user" ? "user" : "assistant", m.text);
  }
  if (state.estimate) { renderProposal(state); lastProposalTotal = state.estimate.total; }
}

document.getElementById("send").addEventListener("click", () => {
  const el = document.getElementById("input");
  const text = el.value.trim();
  if (!text) return;
  el.value = "";
  send(text);
});
document.getElementById("input").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("send").click(); });
document.getElementById("new-session").addEventListener("click", async () => {
  await fetch("/api/runs/" + sid, { method: "DELETE" });
  sid = (localStorage["repair-session"] = crypto.randomUUID().replace(/-/g,"").slice(0,24));
  renderSid();
  document.getElementById("messages").innerHTML = "";
});
loadHistory();
</script>
</body>
</html>
