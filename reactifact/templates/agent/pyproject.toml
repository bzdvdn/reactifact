[project]
name = "my-agent"
version = "0.1.0"
description = "A minimal reactifact agent"
requires-python = ">=3.11"
dependencies = ["reactifact>=0.23.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.8", "mypy>=1.11"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
