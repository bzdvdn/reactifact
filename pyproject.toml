[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reactifact"
version = "0.12.0"
description = "Reactive, artifact-driven agent runtime: agents transform versioned, typed, provenance-aware artifacts inside an evolving context"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "ai-agents", "reactive", "provenance", "orchestration", "agentic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/bzdvdn/reactifact"
Repository = "https://github.com/bzdvdn/reactifact"
Documentation = "https://bzdvdn.github.io/reactifact/"
Changelog = "https://github.com/bzdvdn/reactifact/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
pg = [
    "psycopg[binary]>=3.2",
]
mcp = [
    "mcp>=2.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

# uv-native groups mirror the extras so `uv run`/`uv sync` installs the web demo
# deps by default (no `--extra` flag needed to boot the examples). Extras stay
# for PyPI (`pip install reactifact[web]`). `mcp` joins the default groups too —
# unlike `pg`, its tests need no external service (in-memory MCP transport), so
# there's no reason not to run them for real in CI. `pg` stays opt-in; its own
# test only checks the graceful ImportError path without psycopg installed.
[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
pg = [
    "psycopg[binary]>=3.2",
]
mcp = [
    "mcp>=2.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.uv]
default-groups = ["dev", "web", "mcp"]

# Публикация: в wheel едет только пакет `reactifact`; examples/tests остаются
# в репозитории для демо и разработки, но не попадают в дистрибутив.
[project.scripts]
reactifact = "reactifact.__main__:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["reactifact*"], exclude = ["examples*", "tests*"] } }

[tool.setuptools.package-data]
reactifact = ["py.typed"]
"reactifact.tracing" = ["templates/*.html", "templates/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Enforced by CI's `pytest --cov=reactifact --cov-fail-under=85` (see
# .github/workflows/ci.yml). Current coverage is ~90%; 85% leaves headroom
# for `reactifact/tracing/postgres.py`, whose own test intentionally only
# checks the graceful-ImportError path without `psycopg` installed (`pg` is
# an opt-in extra with no external service in CI) rather than needing a
# per-file carve-out.
[tool.coverage.report]
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["reactifact", "examples"]
# Notebooks are Colab artifacts (IPython magics, top-level await) — not package
# code; don't lint/format them.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # bugbear
    "UP", # pyupgrade
    "SIM",# simplify
]
ignore = [
    "E501", # line length handled by formatter; long prompts allowed
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# entry-скрипты: bootstrap sys.path перед импортом пакета src
"web.py" = ["E402"]
"repair/chat.py" = ["E402"]
"assistant_chat.py" = ["E402"]
"run_example.py" = ["E402"] # пакет-реэксорт: импорты — публичный API

[tool.ruff.format]
# Документы (docs/constitution.md и пр.) не трогаем форматером
exclude = ["*.md"]

[tool.mypy]
python_version = "3.11"
packages = ["reactifact", "examples"]
strict = true
warn_unused_ignores = true
